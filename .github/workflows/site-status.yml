name: 운영 사이트 상태

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: github.event_name != 'deployment_status' || github.event.deployment.environment == 'production' || github.event.deployment.environment == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    concurrency:
      group: sjyc-status-${{ github.event_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: 상태 확인 및 알림
        id: check
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/site_status.py
      - name: 서비스 정상
        if: steps.check.outputs.state == 'up'
        run: echo '웹과 API 정상'
      - name: 서비스 장애
        if: steps.check.outputs.state == 'down'
        run: echo '웹 또는 API 상태 점검 필요' >> "$GITHUB_STEP_SUMMARY"
