# 로컬 개발 인프라. 3306 은 기존 MariaDB, 5433·6380 은 hwaso 가 쓰므로 피한다.
name: sjyc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sjyc
      POSTGRES_PASSWORD: sjyc
      POSTGRES_DB: sjyc
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sjyc']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # 개발용 메일 수신함 (http://localhost:8026)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1026:1025'
      - '8026:8025'

volumes:
  pgdata:
